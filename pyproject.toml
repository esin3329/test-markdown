[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "link-doctor"
version = "2.0.0"
description = "Local Markdown link checking, document ingestion, wiki compilation, and semantic search"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
ingest = ["docling>=2.136,<3"]
search = ["sentence-transformers>=6.1,<7", "transformers>=5.19,<6", "torch>=2.7"]
all = ["docling>=2.136,<3", "sentence-transformers>=6.1,<7", "transformers>=5.19,<6", "torch>=2.7"]

[project.scripts]
link-doctor-py = "link_doctor.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
link_doctor = ["_vendor/wiki_compiler/LICENSE"]
